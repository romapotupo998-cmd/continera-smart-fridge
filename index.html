
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<link rel="manifest" href="manifest.json">
<title>Continera Smart Fridge</title>

<style>
* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: #111315;
 color: #e9eeee;
 font-family: Arial, sans-serif;
 padding: 18px;
 display: flex;
 justify-content: center;
}

.app {
 width: 100%;
 max-width: 410px;
 background: #252a2d;
 border: 2px solid #41494c;
 border-radius: 18px;
 padding: 17px;
 box-shadow: 0 12px 35px #000;
}

.header {
 text-align: center;
 margin-bottom: 18px;
}

.brand {
 font-size: 22px;
 font-weight: bold;
 letter-spacing: 4px;
}

.subtitle {
 font-size: 10px;
 color: #87969b;
 letter-spacing: 2px;
 margin-top: 5px;
}

.screen {
 background: #091116;
 border: 1px solid #344d5b;
 border-radius: 12px;
 padding: 17px;
 margin-bottom: 12px;
 box-shadow: inset 0 0 15px #000;
}

.caption {
 font-size: 10px;
 color: #829eaa;
 text-align: center;
 letter-spacing: 2px;
}

.current {
 font-size: 43px;
 text-align: center;
 color: #8ce4ff;
 margin: 9px 0;
 text-shadow: 0 0 12px #58bfe9;
}

.status {
 text-align: center;
 font-size: 11px;
 color: #75dba5;
}

.section {
 background: #171c1f;
 border: 1px solid #3b4549;
 border-radius: 11px;
 padding: 13px;
 margin-top: 12px;
}

.section-title {
 font-size: 11px;
 color: #91a5ac;
 letter-spacing: 2px;
 margin-bottom: 12px;
}

.target {
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 25px;
 margin: 10px 0;
}

.target-value {
 font-size: 30px;
 min-width: 100px;
 text-align: center;
}

button {
 border: 1px solid #101719;
 border-radius: 8px;
 background: linear-gradient(#41494d,#252c30);
 color: #eee;
 padding: 12px;
 cursor: pointer;
 font-size: 15px;
 touch-action: manipulation;
}

button:active {
 filter: brightness(1.5);
}

button:disabled {
 opacity: .35;
}

.temp-btn {
 width: 48px;
 height: 43px;
 font-size: 23px;
}

.modes {
 display: grid;
 grid-template-columns: repeat(3,1fr);
 gap: 7px;
}

.modes button {
 font-size: 12px;
}

.active {
 background: linear-gradient(#315d69,#203c46);
 border-color: #75c9e4;
 color: #a8edff;
}

.info {
 display: flex;
 justify-content: space-between;
 color: #a5b2b5;
 font-size: 11px;
 margin-top: 12px;
}

.footer {
 text-align: center;
 color: #667478;
 font-size: 9px;
 letter-spacing: 2px;
 margin-top: 18px;
}
</style>
</head>

<body>
<div class="app">

 <div class="header">
  <div class="brand">CONTINERA</div>
  <div class="subtitle">SMART FRIDGE · DAF XG+</div>
 </div>

 <div class="screen">
  <div class="caption">CURRENT TEMPERATURE</div>
  <div class="current" id="currentTemp">+5.0°C</div>
  <div class="status" id="status">● COOLING ACTIVE</div>
 </div>

 <div class="section">
  <div class="section-title">TARGET TEMPERATURE</div>

  <div class="target">
   <button class="temp-btn" id="minus">−</button>
   <div class="target-value" id="targetTemp">+4°C</div>
   <button class="temp-btn" id="plus">+</button>
  </div>

  <div class="info">
   <span>MINIMUM</span>
   <span>+2°C</span>
  </div>

  <div class="info">
   <span>MAXIMUM</span>
   <span>+10°C</span>
  </div>
 </div>

 <div class="section">
  <div class="section-title">COOLING MODE</div>

  <div class="modes">
   <button data-mode="eco">🌿 ECO</button>
   <button data-mode="normal">❄ NORMAL</button>
   <button data-mode="max">⚡ MAX</button>
  </div>
 </div>

 <div class="info">
  <span>COOLING MODE</span>
  <span id="modeStatus">NORMAL</span>
 </div>

 <div class="footer">
  CONTINERA • SMART CABIN SYSTEM
 </div>

</div>

<script>
"use strict";

const STORAGE_KEY = "contineraSmartFridge";

const DEFAULT_STATE = {
 current: 5,
 target: 4,
 mode: "normal"
};

const MODE_SPEED = {
 eco: 0.025,
 normal: 0.05,
 max: 0.09
};

const $ = id => document.getElementById(id);

const elements = {
 current: $("currentTemp"),
 target: $("targetTemp"),
 status: $("status"),
 modeStatus: $("modeStatus"),
 plus: $("plus"),
 minus: $("minus"),
 modeButtons: document.querySelectorAll("[data-mode]")
};

function clamp(value, min, max) {
 return Math.min(max, Math.max(min, value));
}

function loadState() {
 try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

  if (!saved || typeof saved !== "object") {
   return { ...DEFAULT_STATE };
  }

  return {
   current: Number.isFinite(saved.current)
    ? clamp(saved.current, -20, 40)
    : DEFAULT_STATE.current,

   target: Number.isFinite(saved.target)
    ? Math.round(clamp(saved.target, 2, 10))
    : DEFAULT_STATE.target,

   mode: ["eco", "normal", "max"].includes(saved.mode)
    ? saved.mode
    : DEFAULT_STATE.mode
  };

 } catch (error) {
  console.error("Load error:", error);
  return { ...DEFAULT_STATE };
 }
}

let state = loadState();

function saveState() {
 try {
  localStorage.setItem(
   STORAGE_KEY,
   JSON.stringify(state)
  );
 } catch (error) {
  console.error("Save error:", error);
 }
}

function formatTemperature(value) {
 const rounded = Math.round(value * 10) / 10;
 const sign = rounded >= 0 ? "+" : "";

 return sign + rounded.toFixed(1) + "°C";
}

function render() {
 elements.current.textContent =
  formatTemperature(state.current);

 elements.target.textContent =
  "+" + state.target + "°C";

 elements.modeStatus.textContent =
  state.mode.toUpperCase();

 const difference = state.target - state.current;

 if (Math.abs(difference) < 0.0005) {
  elements.status.textContent =
   "● TARGET TEMPERATURE REACHED";
 } else if (difference > 0) {
  elements.status.textContent =
   "● WARMING ACTIVE";
 } else {
  elements.status.textContent =
   "● COOLING ACTIVE";
 }

 elements.minus.disabled = state.target <= 2;
 elements.plus.disabled = state.target >= 10;

 elements.modeButtons.forEach(button => {
  button.classList.toggle(
   "active",
   button.dataset.mode === state.mode
  );
 });

 saveState();
}

function changeTarget(amount) {
 state.target = clamp(
  state.target + amount,
  2,
  10
 );

 render();
}

elements.plus.addEventListener("click", () => {
 changeTarget(1);
});

elements.minus.addEventListener("click", () => {
 changeTarget(-1);
});

elements.modeButtons.forEach(button => {
 button.addEventListener("click", () => {
  state.mode = button.dataset.mode;
  render();
 });
});

function updateTemperature() {
 const difference = state.target - state.current;

 if (Math.abs(difference) < 0.0005) {
  state.current = state.target;
  render();
  return;
 }

 const speed = MODE_SPEED[state.mode];

 const step = Math.min(
  speed,
  Math.abs(difference)
 );

 state.current += Math.sign(difference) * step;

 // Зберігаємо точність до 0.001°C
 state.current = Math.round(state.current * 1000) / 1000;

 if (Math.abs(state.target - state.current) < 0.0005) {
  state.current = state.target;
 }

 render();
}

// Початкове відображення
render();

// Температура оновлюється кожні 3 секунди
setInterval(updateTemperature, 3000);
</script>

<script>
if ("serviceWorker" in navigator) {
 window.addEventListener("load", () => {
  navigator.serviceWorker.register("./sw.js")
   .catch(error => console.error("SW:", error));
 });
}
</script>

</body>
</html>
